completed:
    - id: S01
      title: Shared JSON output plumbing + flag helper
      summary: 'Added two shared helpers to `cmd/helpers.go`: `addJSONFlag(cmd *cobra.Command) *bool` which registers a `--json` flag on any cobra command and returns a pointer to the value, and `printJSON(w io.Writer, v any) error` which marshals a value as `json.MarshalIndent` with `"  "` indent and writes it with a trailing newline. Added table-driven tests for `printJSON` in `helpers_test.go` verifying valid JSON output, trailing newline, and expected field presence.'
      files_created: []
      files_modified:
        - cmd/helpers.go
        - cmd/helpers_test.go
      decisions:
        - Used `cmd.Flags().BoolVar` with a function-local `bool` variable (returned as `*bool`) rather than package-level vars, so each command that calls `addJSONFlag` owns its own flag storage — matches the pattern in `inspect.go` but avoids global state.
        - printJSON` takes `io.Writer` rather than hardcoding `os.Stdout` so commands can pass any writer (supports testability without pipe tricks).
        - 'Suppression mechanism documented via code comment: commands check `*jsonFlag` at the top of `RunE` and take an early-return JSON branch (same pattern `inspect.go` already uses for its inline `inspectJSON` flag). No new abstraction needed since commands write to `fmt.Printf`/`fmt.Fprintf` directly with no logger/color middleware to hook into.'
    - id: S02
      title: '`corvex list --json`'
      summary: 'Added `--json` flag to `corvex list`. When set, it prints a JSON array of `listProject` objects (fields: `name`, `hasSpec`, `hasTasks`, `status`) using the existing `addJSONFlag`/`printJSON` helpers. The status values (`"ready"`, `"needs planning"`, `"no spec"`) are reused from the existing human-output path. Added table-driven tests covering all three status variants, the empty-project case, and verifying human output is unaffected.'
      files_created:
        - cmd/list_test.go
      files_modified:
        - cmd/list.go
      decisions:
        - Refactored the discovery loop so both JSON and human paths share the same `[]listProject` slice instead of duplicating the stat logic — single source of truth for status computation.
        - Kept status strings identical to the existing human output (`"ready"`, `"needs planning"`, `"no spec"`); the spec's `"planned"` example is just illustrative.
        - Empty projects with `--json` returns `[]` (empty array), not the "No projects found" message, because JSON consumers expect a valid array not prose.
    - id: S03
      title: '`corvex status <project> --json`'
      summary: Added `--json` flag to `corvex status <project>`. When set, it prints a single JSON object matching the spec shape (`project`, `total`, `passed`, `failed`, `pending`, `tasks[]` with `id`, `title`, `status`, `dependsOn`) using the existing `addJSONFlag`/`printJSON` helpers. Added table-driven tests covering JSON field correctness, empty `dependsOn` as `[]` not `null`, dependency wiring, and that human output is unaffected.
      files_created: []
      files_modified:
        - cmd/status.go
        - cmd/status_test.go
      decisions:
        - pending` is computed as `total - passed - failed`, so RUNNING and SKIPPED tasks count as pending — consistent with the 2-field spec shape which has no `skipped`/`running` keys.
        - dependsOn` is explicitly set to `[]string{}` when `t.DependsOn` is nil so it marshals as `[]` rather than `null`.
        - The JSON tasks array follows the same topological order as the human output (DAG resolution order, falling back to parse order on cycle).
        - statusJSON *bool` is declared at package level (matches `listJSON` pattern from S02) so `runStatus` can read it without needing the cobra `*Command` argument.
    - id: S04
      title: '`corvex inspect <project> --json`'
      summary: Added `--json` flag to `corvex inspect <project>` that outputs aggregated timeline/metrics as JSON instead of raw activity entries. Extracted a `buildInspectData` helper that both the JSON and human paths share, added JSON struct tags to `TaskMetric` and `Summary` in `internal/activity/ledger.go`, and added 4 table-driven tests covering JSON shape, per-task metrics (duration, retries, cost, tokens), total cost aggregation, and that human output is unaffected.
      files_created:
        - cmd/inspect_test.go
      files_modified:
        - cmd/inspect.go
        - internal/activity/ledger.go
      decisions:
        - Replaced the old `--json` behavior (raw `[]activity.Entry` dump) with the aggregated `inspectOutput` struct matching what `printSummary` renders to humans — this is the "reuse the existing aggregation" the spec asked for.
        - Changed `inspectJSON bool` to `inspectJSON *bool` via `addJSONFlag` for consistency with the S02/S03 pattern.
        - Extracted `buildInspectData` so `printSummary` calls it internally — single source of truth for the stat aggregation, eliminating the local `stat` struct duplication.
        - --task --json` still dumps filtered raw `[]activity.Entry` (unchanged from old behavior) since the spec doesn't address that combination.
        - Added JSON struct tags to `TaskMetric` and `Summary` in `internal/activity` as the task required, using snake_case keys matching the existing `Entry` tag style.
    - id: S05
      title: '`corvex doctor --json` (mantém exit code)'
      summary: Added `--json` flag to `corvex doctor`. When set, it prints a `{"checks":[...],"passed":N,"warnings":N,"failed":N}` JSON object to stdout and still exits non-zero when any check failed. Human output is unchanged when `--json` is not set.
      files_created: []
      files_modified:
        - cmd/doctor.go
        - cmd/doctor_test.go
      decisions:
        - 'Used the standard S02/S03 pattern: package-level `doctorJSON *bool` assigned from `addJSONFlag` in `init()`, early-return JSON branch at the start of the JSON path in `runDoctor`.'
        - Refactored `runDoctor` to count pass/warn/fail before the human print loop so both paths share the same counting logic without duplication.
        - Added `statusString()` method to `checkResult` (returns `"pass"`, `"warn"`, `"fail"`) rather than inline switches — keeps the struct self-contained and the JSON mapping close to the type definition.
        - doctorOutput.Warnings` uses the JSON key `"warnings"` (plural) to match the spec shape exactly (`"warnings":0`).
        - 'Added 3 table-driven tests: JSON shape correctness (all checks have valid name/status, counts sum to len(checks)), failed check still returns non-nil error with `--json`, and human output unchanged without `--json`.'
    - id: S06
      title: Table-driven tests para o output `--json`
      summary: 'Added `cmd/json_fixture_test.go` with a shared `setupCombinedFixture` helper and four table-driven tests — `TestListJSONFixture`, `TestStatusJSONFixture`, `TestInspectJSONFixture`, and `TestDoctorJSONFixture` — that run all `--json` commands against a common fixture project and assert expected field values. The doctor test has two subtests: one for a valid config (all checks pass, no error) and one for a bad provider (failed check count > 0, non-nil error returned).'
      files_created:
        - cmd/json_fixture_test.go
      files_modified: []
      decisions:
        - Created a single shared `setupCombinedFixture` that provisions spec.md, tasks.md (S01 PASSED / S02 PENDING with S01 dependency), an activity ledger with known metrics (8000ms, $0.15, 600/300 tokens, 1 retry), and a valid config.yaml — covering all four commands from one fixture.
        - TestDoctorJSONFixture` is table-driven with two rows (valid and bad-provider configs) rather than two separate test functions, satisfying the "also assert non-zero exit behavior" requirement within the same table.
        - Used the existing `captureStdout` helper (defined in `status_test.go`, shared across the package) rather than duplicating it.
        - All fixture tests use package-level flag vars (`listJSON`, `statusJSON`, etc.) with `defer` resets matching the S02–S05 pattern.
