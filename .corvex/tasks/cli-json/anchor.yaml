next_task_context: S02–S05 each call `addJSONFlag` in their `init()` (storing the returned `*bool` in a package-level var e.g. `var listJSON *bool`), then at the top of their `RunE` check `if *listJSON { return printJSON(os.Stdout, ...) }` and return early — suppressing all human output. `printJSON` accepts any `io.Writer`; pass `os.Stdout` from commands. The helper is in `cmd/helpers.go` (package `cmd`), so all command files can use it directly with no import.
