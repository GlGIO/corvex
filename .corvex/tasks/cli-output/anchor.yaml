completed:
    - id: S01
      title: Renderer plain limpo para eventos do orchestrator
      summary: Added a clean `PlainRenderer` in `cmd/plain_renderer.go` that replaces the old noisy `drainEvents` logger. The renderer maps each orchestrator event type to a scannable one-liner (e.g. `▶ S01  title`, `✓ S01  passed · 1m12s · $0.41`, `✗ S01  failed · msg`, `↻ S01  retry 1`, `⏭ S04  skipped (…)`, `■ planning…`, `✓ plan ready (N tasks)`, `✓ done`). A one-line change to the orchestrator was also made so `EventTaskStart` carries the task title in `Message`.
      files_created:
        - cmd/plain_renderer.go
      files_modified:
        - cmd/run.go
        - internal/orchestrator/orchestrator.go
      decisions:
        - 'Added `Message: t.Title` to the `EventTaskStart` emission in `orchestrator/orchestrator.go` (line 589). This is backward-compatible because the TUI model ignores `Message` for that event type; it populates titles from the pre-loaded DAG.'
        - noColor bool` on `PlainRenderer` controls both glyph selection (Unicode vs ASCII) AND whether lipgloss styles are applied. It is computed in `runRun` from `--no-color` flag, `NO_COLOR` env, and `!isInteractive()` — so piped/non-TTY output is always safe ASCII.
        - Removed the old `drainEvents` function and its `charmbracelet/log` import from `run.go` entirely. The two noisy `log.Info("running"/"completed")` wrapper lines were also removed; the orchestrator events (`EventPlanStart`, `EventDone`) cover that context.
        - EventPlanComplete` is silently ignored (no output) since `EventDAGResolved` follows immediately and carries the task count needed for `✓ plan ready (N tasks)`.
        - The renderer writes to an injected `io.Writer` (not hardcoded `os.Stdout`) so S03's tests can capture output via a `bytes.Buffer` without ANSI codes when `noColor=true`.
    - id: S04
      title: Habilitar `completion` + nota no README
      summary: Verified that cobra's default `completion` command is already enabled (no `DisableDefaultCmd` anywhere in `cmd/root.go`). Added a "Shell completion" section to README.md with usage snippets for bash, zsh, fish, and powershell.
      files_created: []
      files_modified:
        - README.md
      decisions:
        - No code changes were needed — cobra provides completion by default and it was not disabled.
        - Added the README section just before `## License` as a natural placement at the end of user-facing content.
        - Used `source <(...)` pattern for bash/zsh and shell-specific idioms for fish/powershell.
    - id: S05
      title: Completion dinâmica do argumento <project>
      summary: Added dynamic shell completion for the `<project>` argument of `run`, `status`, `logs`, and `reset` commands. A single `completeProjectArg` function was added to `cmd/helpers.go`; it returns `projectNames(workDir)` with `ShellCompDirectiveNoFileComp` when completing the first positional arg, and returns nothing for subsequent args.
      files_created: []
      files_modified:
        - cmd/helpers.go
        - cmd/logs.go
        - cmd/reset.go
        - cmd/run.go
        - cmd/status.go
      decisions:
        - Added `completeProjectArg` to `cmd/helpers.go` (not inline per command) to avoid duplicating logic across four files, consistent with the existing pattern of shared helpers there.
        - Added `"github.com/spf13/cobra"` import to `helpers.go` — it was not previously imported there, but the function requires `cobra.ShellCompDirective` and `cobra.ShellCompDirectiveNoFileComp`.
        - The function signature takes `_ string` for `toComplete` because `projectNames` returns the full list; cobra's built-in prefix filtering handles the narrowing automatically.
        - Returns `nil, cobra.ShellCompDirectiveNoFileComp` (not `ShellCompDirectiveDefault`) on `loadConfig` error, so a broken config never falls back to file completion.
