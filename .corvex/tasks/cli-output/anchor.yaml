next_task_context: 'S02 (quiet flag) should add a `quiet bool` field to `PlainRenderer` and a constructor parameter (or a setter). In `render()`, suppress non-error/non-final events when `quiet == true`; the events to always emit in quiet mode are `EventTaskComplete` (failed), `EventError`, and `EventDone`. The `noColor` computation already lives in `runRun`; S02 should read the `--quiet` flag there the same way. S03 tests should create a `PlainRenderer` with `noColor: true` and inject a `bytes.Buffer` — the output will be deterministic ASCII with no ANSI sequences.'
