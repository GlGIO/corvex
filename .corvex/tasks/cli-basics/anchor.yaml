      title: '`version` subcommand'
      summary: Added `cmd/version.go` with a `versionCmd` cobra command that prints `corvex <version>` using `internal/types.Version`, registered via `init()`. Added `cmd/version_test.go` with `TestVersionCmd` that captures stdout and asserts the output contains `corvex <version>`.
      files_created:
        - cmd/version.go
        - cmd/version_test.go
      files_modified: []
      decisions:
        - Used `Run` (not `RunE`) since the command has no error path — just a `fmt.Printf`.
        - Reused the existing `captureStdout` helper from `status_test.go` (same package, available to all `cmd` tests).
        - Called `versionCmd.Run(versionCmd, nil)` directly in the test rather than going through cobra's Execute, keeping the test simple and avoiding the need for a temp directory.
    - id: S02
      title: Respeitar NO_COLOR + flag global `--no-color`
      summary: Added a persistent `--no-color` flag to `rootCmd` and a `PersistentPreRun` hook that disables color (via `lipgloss.SetColorProfile(termenv.Ascii)` and `charmlog.SetColorProfile(termenv.Ascii)`) when either `--no-color` is set or `NO_COLOR` env var is non-empty. Added `cmd/root_test.go` with two tests covering the flag path and the env path.
      files_created:
        - cmd/root_test.go
      files_modified:
        - cmd/root.go
      decisions:
        - Used `cmd.Flags().GetBool("no-color")` (not `rootCmd.PersistentFlags()`) inside `PersistentPreRun` so the lookup works correctly when cobra resolves the flag on the executing command's merged flag set.
        - Condition is OR (flag OR env non-empty), matching spec and no-color.org standard — empty `NO_COLOR` does not disable color.
        - Used `charmlog` alias for the charmbracelet/log import to avoid collision with the standard `log` package used elsewhere in the cmd package.
    - id: S03
      title: Helpers compartilhados `projectNames` e `suggestProject`
      summary: Added `projectNames(workDir string) []string` and `suggestProject(workDir, name string) string` (with inline Levenshtein DP) to `cmd/helpers.go`. Refactored `cmd/list.go` to use `projectNames` with no output behavior change. Updated `cmd/run.go` to check project existence early and return a structured error listing available projects and a "did you mean?" suggestion when applicable. Added table-driven tests in `cmd/helpers_test.go`.
      files_created:
        - cmd/helpers_test.go
      files_modified:
        - cmd/helpers.go
        - cmd/list.go
        - cmd/run.go
      decisions:
        - projectNames` uses OR semantics (spec.md OR tasks.md) exactly as spec'd; a dir with neither is excluded (minor behavior change in `list` for phantom dirs, considered acceptable per spec intent).
        - suggestProject` tries prefix/substring first, then Levenshtein <= 2; returns the first alphabetical match from `os.ReadDir` ordering (which is lexicographic).
        - Levenshtein implemented inline with the Go 1.24 `min` built-in — no new dependencies.
        - Project existence check in `run.go` is placed immediately after `requireCorvexDir` (before worktree check and dry-run branch) so the helpful error fires first regardless of flags.
        - Used `fmt.Errorf("%s", sb.String())` to keep the multi-line error message without importing `errors`.
