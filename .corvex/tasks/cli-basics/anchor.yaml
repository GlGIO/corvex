next_task_context: rootCmd` now has a `PersistentPreRun`; any subcommand that also defines `PersistentPreRun` will shadow this one (cobra does not chain `PersistentPreRun` by default). If future subcommands need their own `PersistentPreRun`, they must call `rootCmd.PersistentPreRun` (or the equivalent) explicitly, or switch to `PersistentPreRunE` + manual chaining. The `--no-color` flag is persistent and available to all subcommands (S03 "did you mean" work in cmd/helpers.go and cmd/run.go is unaffected).
