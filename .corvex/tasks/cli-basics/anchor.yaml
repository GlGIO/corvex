      summary: S04 was already implemented as part of S03's changes to `cmd/run.go` (lines 71–85). The "did you mean" error path correctly lists available projects via `projectNames` and appends a suggestion from `suggestProject` only when non-empty. All builds and tests pass with no changes required.
