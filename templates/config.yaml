project:
  name: my-project
  description: ""

provider:
  default: claude-cli
  models:
    planner: opus
    worker: sonnet
    reviewer: sonnet

sandbox:
  type: local
  # Extra env-var name prefixes forwarded from your shell into the sandbox, on
  # top of the built-in ones (ANTHROPIC_, CLAUDE_, AWS_*, OPENAI_, CORVEX_).
  # Add the credentials your repo's tooling needs — values stay in your
  # environment, only names are listed here. This only ever adds.
  # env_allowlist:
  #   - GH_TOKEN    # one exact name
  #   - NPM_        # or a prefix, covering NPM_TOKEN, NPM_CONFIG_*, ...

execution:
  max_retries: 2
  auto_commit: true
  parallel: false

review:
  escalation:
    # When the reviewer flags the task description as contradicting spec.md,
    # retrying is pointless — the Planner compacted the spec in a lossy way
    # and the Worker can't recover from it. Route straight to human review
    # so the spec or task description can be clarified.
    ambiguity:
      after: 1
      action: human-prompt

context:
  always_include:
    - .corvex/context/*.md

agent_routing: {}
